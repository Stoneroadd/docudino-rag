[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docudino-rag"
version = "0.1.0"
description = "Local-first document Q&A CLI with BM25 retrieval and grounded LLM answers"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.scripts]
docudino = "docudino.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
